<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林的魅力</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            font-family: "微软雅黑", sans-serif;
            background-color: #e0f7e9;
            color: #2e3d2f;
        }

        header {
            background-color: #2e8b57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #3cb371;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-weight: bold;
        }

        nav a:hover {
            background-color: #2e8b57;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h2 {
            color: #2e8b57;
        }

        .forest-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px 0;
        }

        footer {
            background-color: #2e8b57;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: #f0fff0;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>
    <header>
        <h1>探索森林的魅力</h1>
    </header>

    <nav>
        <a href="#intro">介绍</a>
        <a href="#flora">植物</a>
        <a href="#fauna">动物</a>
    </nav>

    <main>
        <section id="intro">
            <h2>森林简介</h2>
            <p>森林是地球上最重要的生态系统之一，覆盖了地球陆地面积的大约31%。它们不仅为无数生物提供栖息地，还帮助调节气候和净化空气。</p>
            <img class="forest-image" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="美丽的森林">
        </section>

        <section id="flora">
            <h2>森林植物</h2>
            <div class="card">
                <h3>树木</h3>
                <p>森林中的树木种类繁多，从高大的红杉到茂密的榕树，每一种都对生态系统至关重要。</p>
            </div>
            <div class="card">
                <h3>灌木与草本植物</h3>
                <p>除了树木，森林地面还有丰富的灌木和草本植物，它们为小动物提供食物和庇护。</p>
            </div>
        </section>

        <section id="fauna">
            <h2>森林动物</h2>
            <div class="card">
                <h3>哺乳动物</h3>
                <p>森林中生活着各种哺乳动物，如鹿、狐狸、猴子等，它们维持着食物链的平衡。</p>
            </div>
            <div class="card">
                <h3>鸟类与昆虫</h3>
                <p>鸟类和昆虫是森林生态的重要组成部分，帮助传播种子和授粉。</p>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 森林爱好者 | 版权所有
    </footer>
</body>
</html>
